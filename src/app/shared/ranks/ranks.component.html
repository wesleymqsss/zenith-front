<div class="ranking-container shadow-2xl">
  <div class="ranking-header">
    <i class="pi pi-trophy ranking-icon animate-pulse"></i>
    <h2>Ranking das Guildas</h2>
  </div>
  
  <div class="ranking-list" *ngIf="!loading && rankings.length > 0">
    <div *ngFor="let grupo of rankings; let i = index" 
         class="ranking-card" 
         [ngClass]="{'top-1': i === 0, 'top-2': i === 1, 'top-3': i === 2}">
      
      <div class="rank-position">
        <span *ngIf="i > 2">#{{ i + 1 }}</span>
        <i *ngIf="i === 0" class="pi pi-star-fill text-yellow-400 text-3xl drop-shadow-md"></i>
        <i *ngIf="i === 1" class="pi pi-star-fill text-gray-400 text-2xl drop-shadow-sm"></i>
        <i *ngIf="i === 2" class="pi pi-star-fill text-orange-400 text-xl drop-shadow-sm"></i>
      </div>
      
      <div class="group-info">
        <div class="group-name">{{ grupo.nomeGrupo }}</div>
        <div class="group-stats">
          <span><i class="pi pi-users text-emerald-400"></i> {{ grupo.membros }} Membros</span>
          <span><i class="pi pi-check-circle text-purple-400"></i> {{ grupo.missoesConcluidas }}/{{ grupo.missoesTotais }} Missões</span>
        </div>
      </div>
      
      <div class="group-score">
        <div class="success-rate-label">Sucesso</div>
        <div class="success-rate-value">{{ (grupo.taxaSucesso * 100) | number:'1.0-0' }}%</div>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="flex justify-center p-8">
    <i class="pi pi-spin pi-spinner text-emerald-500 text-4xl"></i>
  </div>

  <div *ngIf="!loading && rankings.length === 0" class="text-center p-6 text-gray-400">
    Nenhuma guilda classificada ainda.
  </div>
</div>
